# P2b: browser-act on Fly（Workers Paid Containers 回避）
# デプロイ: cd packages/api && fly deploy -c fly.browser-act.toml
app = "fudo-browser-act"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.browser-act"

[env]
  FUDO_BROWSER_ACT_PUBLIC_URL = "https://fudo-browser-act.fly.dev"

[http_service]
  internal_port = 4176
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
